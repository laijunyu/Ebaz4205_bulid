name: Build EBAZ4205 Linux


on:

  workflow_dispatch:

  push:

    branches:

      - main



jobs:


  build-linux:


    name: Buildroot Linux

    runs-on: ubuntu-22.04



    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Install dependencies

      run: |

        sudo apt update


        sudo apt install -y \
          build-essential \
          git \
          rsync \
          bc \
          bison \
          flex \
          libncurses5-dev \
          libssl-dev \
          device-tree-compiler \
          file \
          wget \
          curl \
          cpio \
          unzip \
          python3 \
          patch \
          perl \
          xz-utils \
          dosfstools \
          mtools



    # 下载 EBAZ4205 Buildroot BSP

    - name: Download Buildroot BSP

      run: |


        git clone \
          --depth 1 \
          https://github.com/embed-me/ebaz4205_buildroot.git \
          ebaz4205_buildroot



        test -f ebaz4205_buildroot/external.desc


        echo "EBAZ4205 BSP OK"



    # 下载 Buildroot

    - name: Download Buildroot 2020.11.4

      run: |


        wget \

          https://buildroot.org/downloads/buildroot-2020.11.4.tar.gz


        tar xf buildroot-2020.11.4.tar.gz


        mv \
          buildroot-2020.11.4 \
          buildroot




    # 配置

    - name: Configure Buildroot

      run: |


        make \
          -C buildroot \
          BR2_EXTERNAL=$GITHUB_WORKSPACE/ebaz4205_buildroot \
          zynq_ebaz4205_defconfig




    # 编译

    - name: Build Linux

      run: |


        make \
          -C buildroot \
          -j$(nproc)




    # 上传结果

    - name: Upload Linux images

      uses: actions/upload-artifact@v4

      with:


        name: ebaz4205-linux-images


        path:

          buildroot/output/images/
