name: Build EBAZ4205 Linux


on:
  workflow_dispatch:

  push:
    branches:
      - main



jobs:

  build-linux:

    name: Buildroot Linux

    runs-on: ubuntu-22.04



    steps:


    - name: Checkout

      uses: actions/checkout@v4



    # -----------------------------
    # 修复 Ubuntu mirror
    # -----------------------------
    - name: Fix Ubuntu mirror

      run: |

        sudo sed -i \
          's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
          /etc/apt/sources.list || true


        sudo apt update -o Acquire::Retries=3



    # -----------------------------
    # 安装依赖
    # -----------------------------
    - name: Install dependencies

      run: |

        sudo apt install -y \
          build-essential \
          git \
          rsync \
          bc \
          bison \
          flex \
          libncurses5-dev \
          libssl-dev \
          device-tree-compiler \
          file \
          wget \
          curl \
          cpio \
          unzip \
          python3 \
          patch \
          perl \
          xz-utils \
          dosfstools \
          mtools



    # -----------------------------
    # 下载 EBAZ4205 external
    # -----------------------------
    - name: Download EBAZ4205 Buildroot external

      run: |

        git clone \
          --depth 1 \
          https://github.com/embed-me/ebaz4205_buildroot.git \
          ebaz4205_buildroot


        echo "===== external files ====="

        ls -la ebaz4205_buildroot


        test -f ebaz4205_buildroot/external.desc



    # -----------------------------
    # 下载 Buildroot 2022.02.11 LTS
    # -----------------------------
    - name: Download Buildroot

      run: |

        wget https://buildroot.org/downloads/buildroot-2022.02.11.tar.gz


        tar xf buildroot-2022.02.11.tar.gz


        mv buildroot-2022.02.11 buildroot



    # -----------------------------
    # 检查 defconfig
    # -----------------------------
    - name: Check EBAZ4205 defconfig

      run: |

        echo "Searching defconfig..."

        find ebaz4205_buildroot \
          -name "*defconfig" \
          -print



    # -----------------------------
    # 配置
    # -----------------------------
    - name: Configure Buildroot

      run: |

        make -C buildroot \
          BR2_EXTERNAL=$GITHUB_WORKSPACE/ebaz4205_buildroot \
          zynq_ebaz4205_defconfig



    # -----------------------------
    # 输出关键配置
    # -----------------------------
    - name: Check configuration

      run: |

        grep -E \
        "BR2_TARGET_UBOOT|BR2_PACKAGE_DROPBEAR|BR2_SYSTEM_DHCP" \
        buildroot/.config || true



    # -----------------------------
    # 编译
    # -----------------------------
    - name: Build Linux

      run: |

        make -C buildroot \
          -j$(nproc)



    # -----------------------------
    # 查看输出
    # -----------------------------
    - name: Show images

      run: |

        ls -lh buildroot/output/images



    # -----------------------------
    # 上传结果
    # -----------------------------
    - name: Upload images

      uses: actions/upload-artifact@v4

      with:

        name: ebaz4205-linux-images

        path: buildroot/output/images/
